<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>People</title>
</head>
<body>
    <h2>Информации о людях</h2>
    {% for any_people in people %}
        <h5> ФИО - {{ any_people.name }} </h5>
        <p> Востраст - {{ any_people.age }} </p>
        <p> Телефон -  {{ any_people.phone }} </p>
    {% endfor %}
</body>
</html>
